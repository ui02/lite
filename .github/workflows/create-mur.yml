name: Create Post

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  create-post:
    if: startsWith(github.event.issue.title, 'mur:')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create mur post
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          # ========================================
          # Issue本文
          # ========================================

          body = os.environ.get("ISSUE_BODY", "")

          # ----------------------------------------
          # 画像部分を取得
          # ----------------------------------------

          image_match = re.search(
              r"<!-- IMAGES -->\s*(.*?)\s*<!-- IMAGES -->",
              body,
              re.DOTALL
          )

          image_block = image_match.group(1) if image_match else ""

          images = [
              line.strip()
              for line in image_block.splitlines()
              if line.strip().startswith("static/images/mur/")
          ]

          # ----------------------------------------
          # 画像部分より前を本文として取得
          # ----------------------------------------

          content = re.split(
              r"\s*<!-- IMAGES -->",
              body,
              maxsplit=1
          )[0].strip()

          # ========================================
          # 日本時間
          # ========================================

          now = datetime.now(ZoneInfo("Asia/Tokyo"))

          year = now.strftime("%Y")
          month = now.month
          date = now.strftime("%Y/%m/%d")

          # ========================================
          # Markdownファイル
          # ========================================

          content_dir = Path("content/mur")
          content_dir.mkdir(parents=True, exist_ok=True)

          file_path = content_dir / f"{year}.md"

          # ========================================
          # 画像URLを作る
          # ========================================

          image_urls = []

          for image in images:

              # static/ を取り除く
              path = image[len("static/"):]

              # GitHub Pagesの /lite/ を付ける
              url = f"/lite/{path}"

              image_urls.append(url)

          # ========================================
          # galleryを作る
          # ========================================

          gallery = ""

          if image_urls:

              count = len(image_urls)

              if count == 1:
                  class_name = "grid-w100"

              elif count == 2:
                  class_name = "grid-w50"

              elif count == 3:
                  class_name = "grid-w33"

              else:
                  class_name = "grid-w50"

              gallery_lines = [
                  f'  <img src="{url}" class="{class_name}">'
                  for url in image_urls
              ]

              gallery = (
                  "{{< gallery >}}\n"
                  + "\n".join(gallery_lines)
                  + "\n{{< /gallery >}}\n"
              )

          # ========================================
          # timelineItemを作る
          # ========================================

          post = (
              f'{{{{< timelineItem icon="twitter" header="" subheader="{date}" >}}}}\n'
              f'{gallery}'
              f'{content}\n'
              f'{{{{< /timelineItem >}}}}\n'
          )

          # ========================================
          # 年ファイルが存在しない場合
          # ========================================

          if not file_path.exists():

              month_heading = f"## {month}月"

              new_file = (
                  "---\n"
                  f'title: "{year}"\n'
                  f"date: {year}-01-01\n"
                  "draft: false\n"
                  "---\n"
                  "\n"
                  f"{month_heading}\n"
                  "\n"
                  "{{< timeline >}}\n"
                  "\n"
                  f"{post}\n"
                  "{{< /timeline >}}\n"
              )

              file_path.write_text(
                  new_file,
                  encoding="utf-8"
              )

          # ========================================
          # 年ファイルが存在する場合
          # ========================================

          else:

              text = file_path.read_text(encoding="utf-8")

              month_heading = f"## {month}月"

              # ====================================
              # その月が既に存在する場合
              # ====================================

              month_pattern = rf"^## {month}月\s*$"

              if re.search(
                  month_pattern,
                  text,
                  re.MULTILINE
              ):

                  # --------------------------------
                  # その月のセクションを取得
                  # --------------------------------

                  pattern = (
                      rf"(^## {month}月\s*$)"
                      rf"(.*?)(?=^## \d+月\s*$|\Z)"
                  )

                  match = re.search(
                      pattern,
                      text,
                      re.MULTILINE | re.DOTALL
                  )

                  if match:

                      month_section = match.group(0)

                      # --------------------------------
                      # timelineの開始直後に追加
                      # --------------------------------

                      timeline_start = "{{< timeline >}}"

                      if timeline_start in month_section:

                          month_section = month_section.replace(
                              timeline_start,
                              timeline_start + "\n\n" + post,
                              1
                          )

                          text = (
                              text[:match.start()]
                              + month_section
                              + text[match.end():]
                          )

                          file_path.write_text(
                              text,
                              encoding="utf-8"
                          )

              # ====================================
              # その月が存在しない場合
              # ====================================

              else:

                  new_month = (
                      f"{month_heading}\n"
                      "\n"
                      "{{< timeline >}}\n"
                      "\n"
                      f"{post}\n"
                      "{{< /timeline >}}\n"
                  )

                  # --------------------------------
                  # 既存の月セクションを取得
                  # --------------------------------

                  sections = re.findall(
                      r"(?ms)^## (\d+)月\s*$.*?(?=^## \d+月\s*$|\Z)",
                      text
                  )

                  # --------------------------------
                  # 新しい月の挿入位置を決める
                  # --------------------------------

                  inserted = False

                  for existing_month in sorted(
                      [int(m) for m in re.findall(r"^## (\d+)月\s*$", text, re.MULTILINE)],
                      reverse=True
                  ):

                      if month > existing_month:

                          existing_heading = f"## {existing_month}月"

                          position = text.find(existing_heading)

                          if position != -1:

                              text = (
                                  text[:position]
                                  + new_month
                                  + "\n"
                                  + text[position:]
                              )

                              inserted = True
                              break

                  # --------------------------------
                  # 一番古い月よりさらに古い場合
                  # --------------------------------

                  if not inserted:

                      headings = list(
                          re.finditer(
                              r"^## \d+月\s*$",
                              text,
                              re.MULTILINE
                          )
                      )

                      if headings:

                          position = headings[-1].start()

                          text = (
                              text[:position]
                              + new_month
                              + "\n"
                              + text[position:]
                          )

                          inserted = True

                  # --------------------------------
                  # 月セクションがまだ1つもない場合
                  # --------------------------------

                  if not inserted:

                      frontmatter_end = text.find("---", 3)

                      if frontmatter_end != -1:

                          insert_position = frontmatter_end + 3

                          text = (
                              text[:insert_position]
                              + "\n\n"
                              + new_month
                              + text[insert_position:]
                          )

                  file_path.write_text(
                      text,
                      encoding="utf-8"
                  )

          # ========================================
          # 完了ログ
          # ========================================

          print(f"Created/updated: {file_path}")

          print("Images:")

          for image in image_urls:
              print(f"  {image}")

          print("Content:")
          print(content)

          PY

      - name: Commit mur post
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add content/mur/

          git commit -m "feat: add mur post" || echo "No changes"

          git push

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
