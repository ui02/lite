
name: Update Murmur

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-murmur:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update Murmur
        run: python scripts/update_murmur.py

      - name: Commit updated Murmur
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/murmur.json assets/images/murmur
          if ! git diff --cached --quiet; then
            git commit -m "Update Murmur"
            git push
          fi
