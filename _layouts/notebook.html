<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "iolite." }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/planner.css' | relative_url }}">
</head>
<body class="notebook-page{% if page.layout == 'diary-post' %} diary-post-page{% endif %}">

<main class="notebook-wrap">

  {% include index-tabs.html %}

  <div class="notebook" aria-label="My little notebook">

    {% include notebook-left.html %}

    <section class="page page-right">
      {{ content }}
    </section>

  </div>
</main>

</body>
</html>
