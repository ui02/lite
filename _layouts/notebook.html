<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "iolite." }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/planner.css' | relative_url }}">
</head>
<body class="notebook-page{% if page.layout == 'diary-post' %} diary-post-page{% endif %}">

<main class="notebook-wrap">

  {% include index-tabs.html %}

  <div class="notebook" aria-label="My little notebook">

    {% include notebook-left.html %}

    <section class="page page-right">
      {{ content }}
    </section>

  </div>

<!-- ライトボックス -->
<dialog id="image-lightbox" class="image-lightbox">
  <button type="button" id="lightbox-close" class="lightbox-close" aria-label="閉じる">×</button>

  <button type="button" id="lightbox-prev" class="lightbox-nav lightbox-prev" aria-label="前の画像">‹</button>

  <img id="lightbox-image" src="" alt="">

  <button type="button" id="lightbox-next" class="lightbox-nav lightbox-next" aria-label="次の画像">›</button>

  <div id="lightbox-counter" class="lightbox-counter"></div>
</dialog>

</main>

</body>
</html>
