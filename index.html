layout: splash

---
<div class="home-random-image">
  <img id="random-home-image" src="" alt="" style="margin-top: clamp(20px, 3vw, 48px);">
</div>

<script>
  const randomImages = [
    "{{ '/assets/images/random/photo01.jpg' | relative_url }}",
    "{{ '/assets/images/random/photo02.jpg' | relative_url }}",
    "{{ '/assets/images/random/photo03.jpg' | relative_url }}"
  ];

  const randomIndex = Math.floor(Math.random() * randomImages.length);
  document.getElementById("random-home-image").src =
    randomImages[randomIndex];
</script>
