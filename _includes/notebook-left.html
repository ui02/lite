<!-- LEFT PAGE -->
<section class="page page-left">
  <div class="page-kicker">
    <span></span>
    <span class="page-number"></span>
  </div>

  <!-- Random photo + site title -->
  <div class="profile-area">
    <div class="profile-photo">
      <img id="random-feature-image" src="" alt="A little moment" class="profile-photo-image">
    </div>
    <h1 class="site-logo">
      <a href="{{ '/' | relative_url }}">iolite.</a>
    </h1>
  </div>

  <!-- UPDATE -->
  <section class="updates">
    <div class="updates-title">
      <span class="updates-icon">⋆˙⟡</span>

      <span class="updates-subtitle">what's new?</span>
    </div>

      <li>
        <time datetime="2026-11-03">11.10</time>
        <span>祝・無職</span>

      <li>
        <time datetime="2026-11-08">11.08</time>

        <i>✧</i>
      </li>
    </ul>
  </section>

  <!-- Spotify playlist -->
  <div class="playlist">
    <div class="playlist-heading">
      <h2 class="playlist-title">♫ Play list</h2>
    </div>
          <div class="spotify-frame">
            <iframe
              data-testid="embed-iframe"
              style="border-radius:12px"
              src="https://open.spotify.com/embed/playlist/1ISYOmMR2i22uJVlNA6nmj?utm_source=generator&si=cfb2c596911f41c0"
              width="100%"
              height="152"
              frameBorder="0"
              allowfullscreen=""
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
              loading="lazy">
            </iframe>
          </div>
  </div>

  <div class="left-footer">
    <span class="page-number">01</span>

  </div>

<!-- Random photo -->
<script>
  const randomImages = [
    "{{ '/assets/images/random/photo01.jpg' | relative_url }}",
    "{{ '/assets/images/random/photo02.jpg' | relative_url }}",
    "{{ '/assets/images/random/photo03.jpg' | relative_url }}"
  ];
  const randomIndex = Math.floor(Math.random() * randomImages.length);
  document.getElementById("random-feature-image").src = randomImages[randomIndex];
</script>
